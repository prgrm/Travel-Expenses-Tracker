<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Travel Expense Tracker</title>
<style>
:root{--bg:#EEF3F4;--card:#fff;--tx:#10242B;--mu:#5E7580;--ac:#0B5563;--acx:#fff;--hi:#F2B632;--hix:#2a1d00;--bd:#D3E0E3;--dg:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#0C171C;--card:#14242B;--tx:#E6F0F2;--mu:#8FA9B2;--ac:#F2B632;--acx:#241a00;--bd:#264049;--dg:#FF8A80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 system-ui,sans-serif;font-variant-numeric:tabular-nums;padding-top:var(--safe-area-inset-top,env(safe-area-inset-top,0px))}
main{max-width:560px;margin:auto;padding:12px 12px 96px}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:11px 12px}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;width:100%;margin:8px 0}
.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row button{flex:1}
.dn{margin-bottom:10px}.dn button{flex:0 0 56px;font-size:22px}
.dl{flex:1;text-align:center;font-weight:700;font-size:18px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{text-transform:capitalize;padding:14px 4px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.amt{gap:8px}.amt button{flex:0 0 64px;font-size:26px;padding:8px 0}
.amt input{flex:1;min-width:0;margin:0;text-align:center;font-size:30px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border-radius:20px;padding:6px 12px;font-size:14px}
.pri{width:100%;background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700;font-size:17px;margin:10px 0 0}
.dg{color:var(--dg)}
h3{margin:16px 4px 4px;font-size:15px;color:var(--mu)}
.mu{color:var(--mu);font-size:13px}
label{display:block;color:var(--mu);font-size:13px}
.item{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:10px;margin:6px 0}
.item b{text-transform:capitalize}
.item span{flex:1;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item em{font-style:normal;font-weight:700}
.seg{display:flex;gap:8px}.seg button{flex:1}
.ys{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ys .card{margin:0;padding:8px}
.mt{width:100%;text-align:left;border:0;background:none;font-weight:700;padding:2px 2px 6px}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.g i{font-style:normal;font-size:11px;color:var(--mu)}
.g button{border:0;background:none;border-radius:6px;padding:3px 0;font-size:12px;min-height:26px}
.g .has{background:var(--hi);color:var(--hix);font-weight:700}
.g .td{outline:2px solid var(--tx)}
.g.big button{min-height:54px;font-size:15px}.g small{display:block;font-size:10px}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
#nav button{flex:1;border:0;border-radius:0;background:none;padding:15px 0}
#nav .on{background:none;color:var(--ac);font-weight:800}
</style></head>
<body><main id="v"></main><nav id="nav"></nav><script src="app.js"></script></body></html>
